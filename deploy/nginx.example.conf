# Example Nginx reverse proxy configuration for revmcp-hub.
# Assumes TLS termination happens at Nginx. You can expose both endpoints on 443,
# or move the southbound /agent/ws server block to any custom port (e.g. 9443).

upstream revmcp_hub_mcp {
    server 127.0.0.1:8443;
    keepalive 32;
}

# If Hub runs with `tunnel_listen` on a separate port (e.g. 127.0.0.1:9443), point this upstream there.
upstream revmcp_hub_tunnel {
    server 127.0.0.1:8443;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name mcp.example.com;

    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Southbound Agent WebSocket tunnel (or move to a separate server { listen <custom_port> ssl; })
    location = /agent/ws {
        proxy_pass http://revmcp_hub_tunnel;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Northbound MCP Streamable HTTP (/mcp and /mcp/{target_id})
    location /mcp {
        # Allow a 10 MB file plus Base64 and JSON overhead.
        client_max_body_size 14m;
        proxy_pass http://revmcp_hub_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Health check endpoint
    location = /healthz {
        proxy_pass http://revmcp_hub_mcp;
        proxy_set_header Host $host;
    }
}
