name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to retry. Leave empty to preview.
        type: string
        required: false

permissions: {}

concurrency:
  group: release-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package Linux binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Select source ref
        id: source
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          ref=$GITHUB_SHA
          if [[ -n $TAG ]]; then
            if [[ ! $TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Expected a stable version tag such as v0.1.0." >&2
              exit 1
            fi
            if [[ $EVENT == workflow_dispatch ]]; then
              if [[ $GITHUB_REF != "refs/heads/$DEFAULT_BRANCH" ]]; then
                echo "Retry a release from the default branch." >&2
                exit 1
              fi
              ref="refs/tags/$TAG"
            fi
          fi
          printf 'ref=%s\ntag=%s\n' "$ref" "$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.ref }}
          persist-credentials: false

      - name: Select package version
        id: version
        env:
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          commit=$(git rev-parse HEAD)
          version=${TAG:-"v0.0.0-dev.${commit:0:12}"}
          printf 'version=%s\ncommit=%s\n' "$version" "$commit" >> "$GITHUB_OUTPUT"

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: '2026.11.7'
          install: false
          cache: false

      - name: Install pinned toolchains
        run: |
          mise trust
          mise trust agent/mise.toml
          mise trust proto/mise.toml
          mise install
          (cd agent && mise install)

      - name: Run checks
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make test vet lint test-e2e verify-static VERSION="$VERSION"

      - name: Build and package release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          make release VERSION="$VERSION"
          (cd "bin/release/$VERSION" && sha256sum -c SHA256SUMS)
          if [[ -f "docs/releases/$VERSION.md" ]]; then
            cp "docs/releases/$VERSION.md" "bin/release/$VERSION/release-notes.md"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: bin/release/${{ steps.version.outputs.version }}/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: release

      - name: Publish verified assets
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          sha256sum -c SHA256SUMS
          ref=$(gh api "repos/$GH_REPO/git/ref/tags/$VERSION" --jq '.object | [.type, .sha] | @tsv')
          IFS=$'\t' read -r kind sha <<< "$ref"
          while [[ $kind == tag ]]; do
            ref=$(gh api "repos/$GH_REPO/git/tags/$sha" --jq '.object | [.type, .sha] | @tsv')
            IFS=$'\t' read -r kind sha <<< "$ref"
          done
          if [[ $kind != commit || $sha != "$EXPECTED_COMMIT" ]]; then
            echo "The remote tag no longer points at the build commit." >&2
            exit 1
          fi
          notes=(--generate-notes)
          if [[ -f release-notes.md ]]; then
            notes=(--notes-file release-notes.md)
          fi
          gh release create "$VERSION" --verify-tag "${notes[@]}" --title "$VERSION" \
            ./*.tar.gz SHA256SUMS
