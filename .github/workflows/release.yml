name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package Linux binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select package version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          commit=$(git rev-parse HEAD)
          if [[ $EVENT == push ]]; then
            if [[ ! $TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Expected a stable version tag such as v0.1.0." >&2
              exit 1
            fi
            version=$TAG
          else
            version="v0.0.0-dev.${commit:0:12}"
          fi
          printf 'version=%s\ncommit=%s\n' "$version" "$commit" >> "$GITHUB_OUTPUT"

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: '2026.11.7'
          install: false
          cache: false

      - name: Install pinned toolchains
        run: |
          mise trust
          mise trust agent/mise.toml
          mise trust proto/mise.toml
          mise install
          (cd agent && mise install)

      - name: Run checks
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make test vet lint test-e2e verify-static VERSION="$VERSION"

      - name: Build and package release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          make release VERSION="$VERSION"
          (cd "bin/release/$VERSION" && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: bin/release/${{ steps.version.outputs.version }}/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: release

      - name: Publish verified assets
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          sha256sum -c SHA256SUMS
          tagged_commit=$(gh api "repos/{owner}/{repo}/commits/tags%2F$VERSION" --jq .sha)
          if [[ $tagged_commit != "$EXPECTED_COMMIT" ]]; then
            echo "The remote tag no longer points at the build commit." >&2
            exit 1
          fi
          gh release create "$VERSION" --verify-tag --generate-notes --title "$VERSION" \
            ./*.tar.gz SHA256SUMS
